root = "."
tmp_dir = "tmp"

[build]
cmd = "cargo build"
bin = "./target/debug/rbxwatch"
full_bin = "./target/debug/rbxwatch"
include_ext = ["rs", "toml"]
exclude_dir = ["target", "tmp", ".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
